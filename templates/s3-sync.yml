# Install into your VAULT CONTENT repo at .github/workflows/s3-sync.yml
# Requires (see SETUP.md):
#   - repo variables: S3_SYNC_BUCKET, S3_SYNC_REGION, S3_SYNC_ROLE_ARN, S3_SYNC_TOOL_REPO
#   - ".sync-tool/" added to the content repo's .gitignore
name: S3 sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */4 * * *" # catches S3-side (plugin) changes; snapshot compaction is age-gated to ~daily
  workflow_dispatch:

concurrency:
  group: s3-sync
  cancel-in-progress: false # serialize runs; CAS guards cross-client races

permissions:
  id-token: write # OIDC → AWS role
  contents: write # push sync commits

jobs:
  sync:
    # Only ever sync from `main`. A feature branch must never reach S3: content
    # built/committed on a non-main branch (e.g. a plugin built on a claude/* branch)
    # would be pushed to S3 and propagate to every device. `push` is already
    # main-only, but `workflow_dispatch` can be fired from any branch (checkout would
    # grab that ref), and a `workflow_run` leg fires regardless of the upstream branch
    # — this guard blocks both unless the ref is main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name != 'workflow_run' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: merge bases via `git show <lastSyncedCommit>:<path>`

      - name: Checkout sync tool
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.S3_SYNC_TOOL_REPO }} # e.g. your-user/vault-sync
          path: .sync-tool
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .sync-tool/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.S3_SYNC_ROLE_ARN }}
          aws-region: ${{ vars.S3_SYNC_REGION }}

      - name: Install sync tool
        run: npm ci --prefix .sync-tool

      - name: Run sync
        env:
          BUCKET: ${{ vars.S3_SYNC_BUCKET }}
          PREFIX: ${{ vars.S3_SYNC_PREFIX }} # <user>/vaults/<name>/ — must match the plugin's prefix
          AWS_REGION: ${{ vars.S3_SYNC_REGION }}
          REPO_DIR: ${{ github.workspace }}
          RETENTION_DAYS: "30"
          SNAPSHOT_MAX_AGE_HOURS: "24" # rebuild snapshot.json.gz at most this often (0 = every run)
          # Optional (§4.14): announce each appended revision so devices pull it immediately instead
          # of at their next poll. Unset = no announcement, everything else unchanged.
          IOT_ENDPOINT: ${{ vars.S3_SYNC_IOT_ENDPOINT }}
          LOG_LEVEL: "info" # debug|info|warn|error — bump to debug for per-file no-op/skip diagnostics
        run: npx --prefix .sync-tool tsx .sync-tool/packages/git-sync/src/main.ts
